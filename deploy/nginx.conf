# /etc/nginx/sites-available/nodebench
# certificate via certbot: certbot --nginx -d bench.instantnode.eu

server {
	listen 80;
	listen [::]:80;
	server_name bench.instantnode.eu;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name bench.instantnode.eu;

	ssl_certificate /etc/letsencrypt/live/bench.instantnode.eu/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/bench.instantnode.eu/privkey.pem;

	client_max_body_size 64k;
	# the pages promise that IP addresses aren't logged
	access_log off;

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_set_header Host $host;
		# overwrite, don't append: the server trusts the first entry
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
