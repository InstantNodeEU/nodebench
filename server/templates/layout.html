{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<meta name="description" content="{{.Desc}}">
<link rel="canonical" href="{{.URL}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="nodebench">
<meta property="og:title" content="{{.Title}}">
<meta property="og:description" content="{{.Desc}}">
<meta property="og:url" content="{{.URL}}">
<meta property="og:image" content="{{.OG}}">
<meta property="og:image:width" content="{{.OGW}}">
<meta property="og:image:height" content="{{.OGH}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#060606">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/site.css?v={{.CSSVer}}">
</head>
<body>
<div class="page{{if or (eq .Name "result") (eq .Name "leaderboard")}} wide{{end}}">
<header class="top">
	<a class="name" href="/">nodebench</a>
	<nav aria-label="Main">
		<a href="/docs"{{if eq .Name "docs"}} aria-current="page"{{end}}>docs</a>
		<a href="/locations"{{if eq .Name "locations"}} aria-current="page"{{end}}>locations</a>
		<a href="/leaderboard"{{if eq .Name "leaderboard"}} aria-current="page"{{end}}>leaderboard</a>
		<a href="/self-host"{{if eq .Name "selfhost"}} aria-current="page"{{end}}>self-host</a>
		<a href="https://github.com/instantnode/nodebench">source</a>
	</nav>
</header>

<main>
{{template "main" .}}
</main>

<footer>
	nodebench is MIT licensed and run by <a href="https://instantnode.eu">InstantNode</a> from Eygelshoven, NL. <a href="/privacy">Privacy</a>.
</footer>
</div>
<script src="/static/map.js?v={{.CSSVer}}" defer></script>
<script>
document.querySelectorAll("[data-copy]").forEach(function (b) {
	b.addEventListener("click", function (e) {
		e.preventDefault();
		var src = document.getElementById(b.dataset.copy);
		var text = src ? src.textContent : b.dataset.copy;
		var label = b.textContent;
		navigator.clipboard.writeText(text).then(function () {
			b.textContent = "copied";
			b.classList.add("done");
			setTimeout(function () { b.textContent = label; b.classList.remove("done"); }, 1500);
		});
	});
});
</script>
</body>
</html>{{end}}
